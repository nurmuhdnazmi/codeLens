[theme]
base = "light"
primaryColor = "#6236BD"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FC"
textColor = "#17233B"
linkColor = "#2457A6"
borderColor = "#D5DDEB"
blueColor = "#2457A6"
blueTextColor = "#2457A6"
blueBackgroundColor = "#EDF4FF"
violetColor = "#6236BD"
codeBackgroundColor = "#F5F7FC"
codeTextColor = "#24324B"
font = "Futura, 'Trebuchet MS', sans-serif"
headingFont = "Futura, 'Trebuchet MS', sans-serif"
codeFont = "monospace"
baseFontSize = 16
codeFontSize = "0.9375rem"
